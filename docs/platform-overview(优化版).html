<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BaiRui Cloud Agent Platform · 智能体控制台</title>
<style>
/* ============ 腾讯云风格设计系统 ============ */
:root {
  /* 品牌色 */
  --tc-primary: #0052D9;          /* 腾讯云主蓝 */
  --tc-primary-hover: #0033b0;
  --tc-primary-light: #E8F3FF;
  --tc-primary-50: #F0F7FF;
  --tc-accent: #305EF8;            /* 亮蓝 accent */
  --tc-accent-2: #722ED1;          /* 紫色 */
  --tc-gradient: linear-gradient(135deg, #0052D9 0%, #305EF8 50%, #722ED1 100%);
  --tc-gradient-soft: linear-gradient(135deg, rgba(0,82,217,.08) 0%, rgba(114,46,209,.08) 100%);

  /* 中性色 */
  --tc-bg: #F5F7FA;                /* 页面背景 */
  --tc-bg-2: #F2F3F5;
  --tc-surface: #FFFFFF;           /* 卡片/表面 */
  --tc-border: #E5E6EB;
  --tc-border-2: #C9CDD4;
  --tc-text: #1F2329;              /* 主文字 */
  --tc-text-2: #4E5969;            /* 次级文字 */
  --tc-text-3: #86909C;            /* 提示文字 */
  --tc-text-4: #C9CDD4;            /* 禁用文字 */

  /* 语义色 */
  --tc-success: #00B42A;
  --tc-success-light: #E8FFEA;
  --tc-warning: #FF7D00;
  --tc-warning-light: #FFF7E8;
  --tc-danger:  #F53F3F;
  --tc-danger-light: #FFECE8;
  --tc-info:    #0FC6C2;
  --tc-info-light: #E8FFFB;

  /* 形状 */
  --tc-radius-sm: 4px;
  --tc-radius: 6px;
  --tc-radius-lg: 8px;
  --tc-radius-xl: 12px;
  --tc-shadow-sm: 0 1px 2px rgba(0,0,0,.04);
  --tc-shadow:    0 2px 8px rgba(0,0,0,.06);
  --tc-shadow-lg: 0 6px 24px rgba(0,0,0,.08);
  --tc-shadow-xl: 0 12px 40px rgba(0,82,217,.12);

  /* 尺寸 */
  --tc-header-h: 56px;
  --tc-sidebar-w: 220px;
  --tc-sidebar-w-collapsed: 56px;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
               "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--tc-bg);
  color: var(--tc-text);
  line-height: 1.5715;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit}

/* ============ 腾讯云式顶部导航 ============ */
.tc-header{
  height: var(--tc-header-h);
  background: var(--tc-surface);
  border-bottom: 1px solid var(--tc-border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  position: sticky;
  top:0; z-index: 100;
  box-shadow: var(--tc-shadow-sm);
}
.tc-header-left{display:flex;align-items:center;gap:20px;flex:1;min-width:0}
.tc-logo{
  display:flex;align-items:center;gap:10px;
  font-weight: 700;
  font-size: 16px;
  color: var(--tc-primary);
  white-space: nowrap;
}
.tc-logo-icon{
  width:32px;height:32px;border-radius:8px;
  background: var(--tc-gradient);
  display:flex;align-items:center;justify-content:center;
  color:#fff; font-weight: 800; font-size: 14px;
  box-shadow: 0 4px 12px rgba(0,82,217,.25);
}
.tc-logo-text{
  display:flex;align-items:center;gap:4px;
  font-size:13px;color:var(--tc-text);
  font-weight:600;line-height:1.1;
}
.tc-logo-brand{color:var(--tc-text);font-weight:700}
.tc-logo-divider{
  width:1px;height:14px;background:var(--tc-border-2);
}
.tc-logo-sub{color:var(--tc-text-2);font-weight:500}
.tc-product-switch{
  display:flex;align-items:center;gap:4px;
  padding: 6px 10px;
  border-radius: var(--tc-radius-sm);
  color: var(--tc-text-2);
  font-size: 13px;
  cursor: pointer;
  transition: all .15s;
}
.tc-product-switch:hover{background: var(--tc-bg);color:var(--tc-primary)}
.tc-product-switch svg{width:14px;height:14px}

.tc-nav-menu{display:flex;align-items:center;gap:4px;margin-left:12px}
.tc-nav-item{
  padding: 8px 14px;
  font-size: 13px;
  color: var(--tc-text-2);
  border-radius: var(--tc-radius-sm);
  cursor: pointer;
  position: relative;
  transition: all .15s;
  white-space: nowrap;
}
.tc-nav-item:hover{color:var(--tc-primary);background:var(--tc-primary-50)}
.tc-nav-item.active{color:var(--tc-primary);font-weight:600}
.tc-nav-item.active::after{
  content:'';position:absolute;left:14px;right:14px;bottom:-1px;
  height:2px;background:var(--tc-primary);border-radius:2px;
}

.tc-header-right{display:flex;align-items:center;gap:6px}
.tc-search{
  display:flex;align-items:center;gap:8px;
  width: 280px;
  background: var(--tc-bg);
  border: 1px solid var(--tc-border);
  padding: 6px 12px;
  border-radius: 999px;
  transition: all .15s;
}
.tc-search:focus-within{
  background: #fff;
  border-color: var(--tc-primary);
  box-shadow: 0 0 0 3px rgba(0,82,217,.08);
}
.tc-search svg{width:14px;height:14px;color:var(--tc-text-3);flex-shrink:0}
.tc-search input{
  flex:1;border:none;outline:none;background:transparent;
  font-size: 13px; color: var(--tc-text); min-width:0;
}
.tc-search input::placeholder{color:var(--tc-text-3)}

.tc-icon-btn{
  width:36px;height:36px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  color: var(--tc-text-2);
  position: relative;
  transition: all .15s;
}
.tc-icon-btn:hover{background:var(--tc-bg);color:var(--tc-primary)}
.tc-icon-btn svg{width:18px;height:18px}
.tc-dot{
  position:absolute;top:8px;right:8px;
  width:8px;height:8px;border-radius:50%;
  background: var(--tc-danger);
  border: 2px solid #fff;
}

.tc-region{
  display:flex;align-items:center;gap:6px;
  padding: 6px 10px;
  border-radius: var(--tc-radius-sm);
  color: var(--tc-text-2);
  font-size: 13px;
  cursor: pointer;
  transition: all .15s;
}
.tc-region:hover{background:var(--tc-bg);color:var(--tc-primary)}
.tc-region svg{width:14px;height:14px}

.tc-user{
  display:flex;align-items:center;gap:10px;
  padding: 4px 4px 4px 12px;
  border-radius: 999px;
  cursor: pointer;
  transition: all .15s;
}
.tc-user:hover{background:var(--tc-bg)}
.tc-avatar{
  width:32px;height:32px;border-radius:50%;
  background: var(--tc-gradient);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;
}
.tc-user-info{line-height:1.2}
.tc-user-name{font-size:13px;color:var(--tc-text);font-weight:500}
.tc-user-role{font-size:11px;color:var(--tc-text-3)}

/* ============ 主布局 ============ */
.tc-layout{display:flex;min-height: calc(100vh - var(--tc-header-h))}

/* ============ 侧边栏 ============ */
.tc-sidebar{
  width: var(--tc-sidebar-w);
  background: var(--tc-surface);
  border-right: 1px solid var(--tc-border);
  padding: 12px 8px;
  flex-shrink:0;
  overflow-y: auto;
  position: sticky;
  top: var(--tc-header-h);
  height: calc(100vh - var(--tc-header-h));
}
.tc-sidebar-group{margin-bottom: 8px}
.tc-sidebar-title{
  padding: 10px 12px 6px;
  font-size: 11px;
  font-weight: 600;
  color: var(--tc-text-3);
  text-transform: uppercase;
  letter-spacing: .5px;
}
.tc-sidebar-item{
  display:flex;align-items:center;gap:10px;
  padding: 8px 12px;
  margin-bottom: 2px;
  border-radius: var(--tc-radius);
  font-size: 13px;
  color: var(--tc-text-2);
  cursor: pointer;
  transition: all .15s;
  position: relative;
}
.tc-sidebar-item:hover{
  background: var(--tc-bg);
  color: var(--tc-text);
}
.tc-sidebar-item.active{
  background: var(--tc-primary-light);
  color: var(--tc-primary);
  font-weight: 600;
}
.tc-sidebar-item.active::before{
  content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;
  background: var(--tc-primary);
  border-radius: 0 3px 3px 0;
}
.tc-sidebar-item svg{width:16px;height:16px;flex-shrink:0}
.tc-sidebar-item .label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-sidebar-badge{
  background: var(--tc-primary);
  color:#fff;
  font-size: 11px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 10px;
  min-width: 18px;
  text-align: center;
}
.tc-sidebar-badge.alt{
  background: var(--tc-danger);
}
.tc-sidebar-badge.warn{
  background: var(--tc-warning);
}

/* ============ 主内容区 ============ */
.tc-main{
  flex:1;
  min-width: 0;
  padding: 20px 28px 40px;
  overflow-x: hidden;
}

/* ============ 面包屑 & 页头 ============ */
.tc-breadcrumb{
  display:flex;align-items:center;gap:6px;
  font-size: 13px;
  color: var(--tc-text-3);
  margin-bottom: 14px;
}
.tc-breadcrumb a{color:var(--tc-text-3);transition:color .15s}
.tc-breadcrumb a:hover{color:var(--tc-primary)}
.tc-breadcrumb .sep{color:var(--tc-text-4)}
.tc-breadcrumb .current{color:var(--tc-text);font-weight:500}

/* ============ 智能体管理页头 ============ */
.tc-workbench-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  padding:8px 0 20px;
  margin-bottom:4px;
  border-bottom:1px solid var(--tc-border);
}
.tc-workbench-head-copy{min-width:0}
.tc-workbench-eyebrow{
  margin:0 0 6px;
  color:var(--tc-text-3);
  font-size:12px;
  font-weight:600;
  letter-spacing:.08em;
}
.tc-workbench-head h1{
  margin:0;
  color:var(--tc-text);
  font-size:24px;
  font-weight:650;
  letter-spacing:0;
  line-height:1.2;
}
.tc-workbench-head p{
  max-width:600px;
  margin:7px 0 0;
  color:var(--tc-text-2);
  font-size:13px;
  line-height:1.6;
}
.tc-workbench-actions{display:flex;align-items:center;gap:12px;flex-shrink:0}
.tc-workbench-summary{color:var(--tc-text-3);font-size:12px;white-space:nowrap}

/* ============ 按钮 ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height: 32px;
  padding: 0 16px;
  border-radius: var(--tc-radius);
  font-size: 13px;
  font-weight: 500;
  border: 1px solid transparent;
  transition: all .15s;
  white-space: nowrap;
  user-select: none;
}
.btn svg{width:14px;height:14px}
.btn-primary{
  background: var(--tc-primary);
  color:#fff;
  box-shadow: 0 2px 6px rgba(0,82,217,.2);
}
.btn-primary:hover{background:var(--tc-primary-hover);box-shadow:0 4px 12px rgba(0,82,217,.28)}
.btn-primary:active{transform:translateY(1px)}
.btn-ghost-white{
  background: rgba(255,255,255,.15);
  border: 1px solid rgba(255,255,255,.3);
  color:#fff;
  backdrop-filter: blur(4px);
}
.btn-ghost-white:hover{background:rgba(255,255,255,.25)}
.btn-default{
  background: #fff;
  border-color: var(--tc-border);
  color: var(--tc-text);
}
.btn-default:hover{border-color:var(--tc-primary);color:var(--tc-primary);background:var(--tc-primary-50)}
.btn-outline{
  background: transparent;
  border-color: var(--tc-primary);
  color: var(--tc-primary);
}
.btn-outline:hover{background:var(--tc-primary-light)}
.btn-danger{
  background: #fff;
  border-color: var(--tc-danger);
  color: var(--tc-danger);
}
.btn-danger:hover{background:var(--tc-danger-light)}
.btn-sm{height:26px;padding:0 10px;font-size:12px;border-radius:4px}
.btn-lg{height:40px;padding:0 22px;font-size:14px;border-radius:var(--tc-radius-lg)}

/* ============ 标签 Tab Bar ============ */
.tc-tabs{
  display:flex;
  align-items:center;
  gap: 0;
  border-bottom: 1px solid var(--tc-border);
  margin-bottom: 20px;
  background: var(--tc-surface);
  border-radius: var(--tc-radius-lg) var(--tc-radius-lg) 0 0;
  padding: 0 8px;
}
.tc-tab{
  padding: 14px 20px;
  font-size: 14px;
  color: var(--tc-text-2);
  cursor: pointer;
  position: relative;
  transition: all .15s;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.tc-tab:hover{color:var(--tc-primary)}
.tc-tab.active{color:var(--tc-primary);font-weight:600}
.tc-tab.active::after{
  content:'';position:absolute;left:12px;right:12px;bottom:-1px;
  height:3px;background:var(--tc-primary);border-radius:3px 3px 0 0;
}
.tc-tab .mini-badge{
  background: var(--tc-bg-2);
  color: var(--tc-text-3);
  font-size: 11px;
  padding: 1px 7px;
  border-radius: 999px;
  font-weight: 500;
}
.tc-tab.active .mini-badge{
  background: var(--tc-primary-light);
  color: var(--tc-primary);
}

/* ============ 操作栏 ============ */
.tc-toolbar{
  display:flex;align-items:center;justify-content:space-between;
  gap: 16px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.tc-toolbar-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tc-toolbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.tc-input, .tc-select{
  height: 32px;
  padding: 0 12px;
  background: #fff;
  border: 1px solid var(--tc-border);
  border-radius: var(--tc-radius);
  font-size: 13px;
  color: var(--tc-text);
  outline: none;
  transition: all .15s;
  min-width: 160px;
}
.tc-input:focus, .tc-select:focus{
  border-color: var(--tc-primary);
  box-shadow: 0 0 0 3px rgba(0,82,217,.08);
}
.tc-input::placeholder{color:var(--tc-text-3)}
.tc-search-box{
  display:flex;align-items:center;
  height:32px;
  background:#fff;
  border:1px solid var(--tc-border);
  border-radius: var(--tc-radius);
  padding: 0 12px;
  gap: 8px;
  min-width: 240px;
  transition: all .15s;
}
.tc-search-box:focus-within{
  border-color: var(--tc-primary);
  box-shadow: 0 0 0 3px rgba(0,82,217,.08);
}
.tc-search-box svg{width:14px;height:14px;color:var(--tc-text-3)}
.tc-search-box input{
  flex:1;border:none;outline:none;background:transparent;
  font-size:13px;color:var(--tc-text);min-width:0;
}
.tc-search-box input::placeholder{color:var(--tc-text-3)}

/* ============ 统计卡片（KPI） ============ */
.tc-kpi-grid{
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 20px;
}
.tc-kpi{
  background: var(--tc-surface);
  border: 1px solid var(--tc-border);
  border-radius: var(--tc-radius-lg);
  padding: 18px 20px;
  position: relative;
  overflow: hidden;
  transition: all .2s;
  box-shadow: var(--tc-shadow-sm);
}
.tc-kpi:hover{
  box-shadow: var(--tc-shadow-lg);
  transform: translateY(-2px);
  border-color: transparent;
}
.tc-kpi::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background: var(--kpi-color, var(--tc-primary));
  border-radius: var(--tc-radius-lg) 0 0 var(--tc-radius-lg);
}
.tc-kpi-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom: 12px;
}
.tc-kpi-label{
  font-size: 13px;
  color: var(--tc-text-2);
  display:flex;align-items:center;gap:6px;
}
.tc-kpi-icon{
  width:32px;height:32px;border-radius:8px;
  background: var(--kpi-bg, var(--tc-primary-light));
  color: var(--kpi-color, var(--tc-primary));
  display:flex;align-items:center;justify-content:center;
}
.tc-kpi-icon svg{width:16px;height:16px}
.tc-kpi-value{
  font-size: 26px;
  font-weight: 700;
  line-height: 1.15;
  color: var(--tc-text);
  font-variant-numeric: tabular-nums;
  letter-spacing: -.5px;
  margin-bottom: 6px;
}
.tc-kpi-sub{
  display:flex;align-items:center;gap:8px;
  font-size: 12px;
  color: var(--tc-text-3);
}
.tc-kpi-trend{
  display:inline-flex;align-items:center;gap:2px;
  padding: 1px 7px;border-radius:999px;
  font-size: 11px;font-weight:600;
}
.tc-kpi-trend.up{background:var(--tc-success-light);color:var(--tc-success)}
.tc-kpi-trend.down{background:var(--tc-danger-light);color:var(--tc-danger)}

/* ============ 卡片容器 ============ */
.tc-card{
  background: var(--tc-surface);
  border: 1px solid var(--tc-border);
  border-radius: var(--tc-radius-lg);
  box-shadow: var(--tc-shadow-sm);
  margin-bottom: 20px;
  overflow: hidden;
  transition: box-shadow .2s;
}
.tc-card:hover{box-shadow: var(--tc-shadow)}
.tc-card-head{
  display:flex;align-items:center;justify-content:space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--tc-border);
}
.tc-card-title{
  display:flex;align-items:center;gap:8px;
  font-size: 15px;
  font-weight: 600;
  color: var(--tc-text);
}
.tc-card-title svg{width:16px;height:16px;color:var(--tc-primary)}
.tc-card-title .hint{
  font-size: 12px;
  font-weight: normal;
  color: var(--tc-text-3);
  margin-left: 4px;
}
.tc-card-extra{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--tc-text-2)}
.tc-card-body{padding: 20px}
.tc-card-body.no-pad{padding:0}

/* ============ 模板画廊（EdgeOne Makers 风格） ============ */
.tc-template-section{margin-bottom: 24px}
.tc-section-title{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom: 14px;
}
.tc-section-title h2{
  font-size: 16px;
  font-weight: 600;
  color: var(--tc-text);
  display:flex;align-items:center;gap:8px;
}
.tc-section-title h2::before{
  content:'';
  width: 3px; height: 16px;
  background: var(--tc-gradient);
  border-radius: 2px;
}
.tc-section-title a{
  color: var(--tc-primary);
  font-size: 13px;
  display:inline-flex;align-items:center;gap:2px;
}
.tc-section-title a:hover{text-decoration:underline}

.tc-template-grid{
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 14px;
}
.tc-template-card{
  background: var(--tc-surface);
  border: 1px solid var(--tc-border);
  border-radius: var(--tc-radius-lg);
  padding: 16px;
  cursor: pointer;
  transition: all .2s;
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 170px;
}
.tc-template-card:hover{
  border-color: var(--tc-primary);
  box-shadow: var(--tc-shadow-xl);
  transform: translateY(-3px);
}
.tc-template-icon{
  width: 44px; height: 44px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  background: var(--tpl-bg, var(--tc-gradient-soft));
  flex-shrink: 0;
}
.tc-template-icon svg{width:22px;height:22px;color: var(--tpl-color, var(--tc-primary))}
.tc-template-name{
  font-size: 14px;
  font-weight: 600;
  color: var(--tc-text);
  line-height: 1.35;
}
.tc-template-desc{
  font-size: 12px;
  color: var(--tc-text-3);
  line-height: 1.55;
  flex: 1;
  min-width: 0;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.tc-template-meta{
  display:flex;align-items:center;gap:6px;
  flex-wrap: wrap;
  padding-top: 8px;
  border-top: 1px dashed var(--tc-border);
}
.tc-tag{
  display:inline-flex;align-items:center;gap:3px;
  padding: 1px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 500;
  background: var(--tc-bg-2);
  color: var(--tc-text-2);
}
.tc-tag.blue{background:var(--tc-primary-light);color:var(--tc-primary)}
.tc-tag.green{background:var(--tc-success-light);color:var(--tc-success)}
.tc-tag.orange{background:var(--tc-warning-light);color:var(--tc-warning)}
.tc-tag.purple{background:#F3E8FF;color:#722ED1}
.tc-tag.cyan{background:var(--tc-info-light);color:var(--tc-info)}
.tc-tag.red{background:var(--tc-danger-light);color:var(--tc-danger)}

/* ============ Agent 项目卡片 ============ */
.tc-agent-grid{
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}
.tc-agent-card{
  background: var(--tc-surface);
  border: 1px solid var(--tc-border);
  border-radius: var(--tc-radius-lg);
  padding: 20px;
  transition: all .2s;
  position: relative;
  box-shadow: var(--tc-shadow-sm);
}
.tc-agent-card:hover{
  box-shadow: var(--tc-shadow-lg);
  border-color: var(--tc-border-2);
}
.tc-agent-top{
  display:flex;align-items:flex-start;justify-content:space-between;
  margin-bottom: 12px;
  gap: 12px;
}
.tc-agent-info{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.tc-agent-logo{
  width: 48px; height: 48px;
  border-radius: 12px;
  display:flex;align-items:center;justify-content:center;
  background: var(--tc-gradient-soft);
  font-size: 24px;
  flex-shrink: 0;
  border: 1px solid var(--tc-border);
}
.tc-agent-logo svg{width:22px;height:22px;color:var(--tpl-color,var(--tc-primary))}
.tc-agent-meta{min-width:0;flex:1}
.tc-agent-name{
  display:flex;align-items:center;gap:8px;
  font-size: 15px;
  font-weight: 600;
  color: var(--tc-text);
  margin-bottom: 4px;
}
.tc-agent-name .host{
  font-size: 11px;
  color: var(--tc-text-3);
  font-weight: normal;
  background: var(--tc-bg-2);
  padding: 1px 7px;
  border-radius: 4px;
}
.tc-agent-desc{
  font-size: 12px;
  color: var(--tc-text-3);
  line-height: 1.5;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.tc-status{
  display:inline-flex;align-items:center;gap:5px;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 500;
  flex-shrink: 0;
}
.tc-status::before{
  content:'';
  width:6px;height:6px;border-radius:50%;
  background: currentColor;
}
.tc-status.running{background:var(--tc-success-light);color:var(--tc-success)}
.tc-status.deploying{background:var(--tc-warning-light);color:var(--tc-warning)}
.tc-status.stopped{background:var(--tc-bg-2);color:var(--tc-text-3)}
.tc-status.failed{background:var(--tc-danger-light);color:var(--tc-danger)}
.tc-status.init{background:#E8F3FF;color:var(--tc-primary)}

.tc-agent-body{
  margin: 12px -20px 0;
  padding: 14px 20px;
  border-top: 1px solid var(--tc-border);
  background: linear-gradient(180deg, var(--tc-bg) 0%, transparent 100%);
}
.tc-agent-stats{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap: 10px;
  margin-bottom: 14px;
}
.tc-agent-stat{
  text-align: left;
}
.tc-agent-stat .num{
  font-size: 16px;
  font-weight: 600;
  color: var(--tc-text);
  line-height: 1.2;
  margin-bottom: 2px;
  font-variant-numeric: tabular-nums;
}
.tc-agent-stat .lbl{
  font-size: 11px;
  color: var(--tc-text-3);
}
.tc-agent-stat .unit{font-size:11px;color:var(--tc-text-3);font-weight:normal;margin-left:2px}

.tc-agent-footer{
  display:flex;align-items:center;justify-content:space-between;
  gap: 10px;
}
.tc-agent-channels{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.tc-channel-dot{
  width:24px;height:24px;border-radius:6px;
  background: var(--tc-bg-2);
  display:flex;align-items:center;justify-content:center;
  font-size: 12px;
  color: var(--tc-text-2);
  transition: all .15s;
  cursor: pointer;
  border:1px solid var(--tc-border);
}
.tc-channel-dot:hover{background:var(--tc-primary-light);color:var(--tc-primary);border-color:transparent}
.tc-actions{display:flex;align-items:center;gap:6px}
.tc-action-btn{
  height:26px;padding:0 10px;
  border-radius:var(--tc-radius-sm);
  font-size:12px;
  background: #fff;
  border:1px solid var(--tc-border);
  color:var(--tc-text-2);
  display:inline-flex;align-items:center;gap:4px;
  transition: all .15s;
}
.tc-action-btn:hover{border-color:var(--tc-primary);color:var(--tc-primary);background:var(--tc-primary-50)}
.tc-action-btn.primary{
  background: var(--tc-primary);
  border-color: var(--tc-primary);
  color: #fff;
}
.tc-action-btn.primary:hover{background:var(--tc-primary-hover);border-color:var(--tc-primary-hover);color:#fff}
.tc-action-btn svg{width:12px;height:12px}

/* ============ 表格（腾讯风） ============ */
.tc-table-wrap{
  background: var(--tc-surface);
  border: 1px solid var(--tc-border);
  border-radius: var(--tc-radius-lg);
  overflow: hidden;
  box-shadow: var(--tc-shadow-sm);
}
.tc-table{
  width:100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 13px;
}
.tc-table thead th{
  background: var(--tc-bg);
  color: var(--tc-text-2);
  font-weight: 600;
  font-size: 12px;
  text-align: left;
  padding: 11px 16px;
  border-bottom: 1px solid var(--tc-border);
  white-space: nowrap;
}
.tc-table tbody td{
  padding: 13px 16px;
  border-bottom: 1px solid var(--tc-border);
  color: var(--tc-text);
  vertical-align: middle;
}
.tc-table tbody tr:last-child td{border-bottom:none}
.tc-table tbody tr{transition: background .12s}
.tc-table tbody tr:hover td{background: var(--tc-primary-50)}
.tc-table .muted{color:var(--tc-text-3)}
.tc-table .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;color:var(--tc-text-2)}

.tc-cell-link{
  color:var(--tc-primary);
  font-weight: 500;
  cursor: pointer;
  transition: opacity .15s;
}
.tc-cell-link:hover{opacity:.8;text-decoration:underline}

/* ============ 迷你进度条 ============ */
.tc-mini-bar{
  width: 100%;
  height: 6px;
  background: var(--tc-bg-2);
  border-radius: 3px;
  overflow: hidden;
}
.tc-mini-bar > span{
  display:block;height:100%;
  background: var(--tc-gradient);
  border-radius: 3px;
  transition: width .3s;
}

/* ============ 审批告警条 ============ */
.tc-alert{
  display:flex;align-items:flex-start;gap:12px;
  padding: 14px 18px;
  border-radius: var(--tc-radius-lg);
  margin-bottom: 16px;
  font-size: 13px;
  line-height: 1.6;
}
.tc-alert.warning{
  background: var(--tc-warning-light);
  border: 1px solid #FFE7BA;
  color: #873800;
}
.tc-alert.danger{
  background: var(--tc-danger-light);
  border: 1px solid #FFCCC7;
  color: #830000;
}
.tc-alert.info{
  background: var(--tc-primary-50);
  border: 1px solid #BEDAFF;
  color: #002A7A;
}
.tc-alert-icon{
  flex-shrink: 0;
  width:20px;height:20px;
  display:flex;align-items:center;justify-content:center;
}
.tc-alert-icon svg{width:20px;height:20px}
.tc-alert-content{flex:1;min-width:0}
.tc-alert-title{font-weight:600;margin-bottom:2px}
.tc-alert-actions{display:flex;gap:8px;flex-shrink:0;margin-top:2px}

/* ============ 可观测仪表板图表占位 ============ */
.tc-chart-grid{
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 16px;
  margin-bottom: 20px;
}
.tc-chart{
  background: var(--tc-surface);
  border: 1px solid var(--tc-border);
  border-radius: var(--tc-radius-lg);
  padding: 20px;
  box-shadow: var(--tc-shadow-sm);
}
.tc-chart-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom: 16px;
}
.tc-chart-title{
  font-size: 14px;
  font-weight: 600;
  display:flex;align-items:center;gap:8px;
  color: var(--tc-text);
}
.tc-chart-title .dot{
  width:6px;height:6px;border-radius:50%;background:var(--tc-primary);
}
.tc-chart-legend{display:flex;align-items:center;gap:16px;font-size:12px;color:var(--tc-text-2)}
.tc-chart-legend span{display:inline-flex;align-items:center;gap:5px}
.tc-chart-legend i{
  width:10px;height:10px;border-radius:3px;display:inline-block;
}

/* 纯 CSS 折线图 */
.tc-line-chart{
  position: relative;
  height: 200px;
  padding: 0 4px;
}
.tc-line-grid{
  position:absolute;inset:0 0 20px 0;
  background-image:
    linear-gradient(to right, transparent calc(100% / 6 - 1px), var(--tc-border) calc(100% / 6)),
    linear-gradient(to bottom, var(--tc-border) 1px, transparent 1px);
  background-size: calc(100% / 6) 25%, 100% 25%;
}
.tc-line{
  position:absolute;bottom:20px;left:0;right:0;height:calc(100% - 20px);
}
.tc-line svg{width:100%;height:100%;overflow:visible}
.tc-line path.area{fill:url(#grad1);opacity:.3}
.tc-line path.line{fill:none;stroke:var(--tc-primary);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tc-line path.line2{fill:none;stroke:var(--tc-text-2);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray: 4 4}
.tc-xaxis{
  position:absolute;left:0;right:0;bottom:0;height:20px;
  display:flex;justify-content:space-between;align-items:flex-end;
  font-size:11px;color:var(--tc-text-3);
}

/* 纯 CSS 环形图 */
.tc-ring-wrap{
  display:flex;align-items:center;gap:20px;
  height: 200px;
}
.tc-ring{
  width:140px;height:140px;border-radius:50%;position:relative;flex-shrink:0;
}
.tc-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tc-ring circle.bg{fill:none;stroke:var(--tc-bg-2);stroke-width:14}
.tc-ring circle.val{fill:none;stroke-width:14;stroke-linecap:round;stroke:var(--tc-primary);stroke-dasharray: 377;stroke-dashoffset: 120}
.tc-ring .center{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  flex-direction: column;
}
.tc-ring .center .n{font-size:24px;font-weight:700;color:var(--tc-text);line-height:1}
.tc-ring .center .l{font-size:11px;color:var(--tc-text-3);margin-top:4px}
.tc-ring-legend{
  flex:1;display:flex;flex-direction:column;gap:10px;
}
.tc-ring-legend .item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:12px;
}
.tc-ring-legend .name{display:flex;align-items:center;gap:6px;color:var(--tc-text-2)}
.tc-ring-legend .value{font-weight:600;color:var(--tc-text)}
.tc-ring-legend .bar{
  width:10px;height:10px;border-radius:3px;display:inline-block;
}

/* ============ 模态弹窗 ============ */
.modal-bg{
  position:fixed;inset:0;
  background: rgba(29,33,41,.45);
  backdrop-filter: blur(4px);
  display:flex;align-items:center;justify-content:center;
  z-index: 1000;
  padding: 20px;
  animation: fadeIn .18s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background: var(--tc-surface);
  border-radius: var(--tc-radius-xl);
  width: 100%;
  max-width: 520px;
  box-shadow: 0 24px 64px rgba(0,0,0,.2);
  overflow: hidden;
  animation: slideUp .22s ease;
}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding: 18px 22px;
  border-bottom: 1px solid var(--tc-border);
}
.modal-title{
  font-size: 16px;
  font-weight: 600;
  color: var(--tc-text);
  display:flex;align-items:center;gap:8px;
}
.modal-title svg{width:18px;height:18px;color:var(--tc-primary)}
.modal-close{
  width:28px;height:28px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  color: var(--tc-text-3);
  transition: all .15s;
}
.modal-close:hover{background:var(--tc-bg);color:var(--tc-text)}
.modal-close svg{width:16px;height:16px}
.modal-body{padding:22px}
.modal-foot{
  display:flex;justify-content:flex-end;gap:10px;
  padding: 14px 22px;
  border-top: 1px solid var(--tc-border);
  background: var(--tc-bg);
}
.field{margin-bottom: 16px}
.field:last-child{margin-bottom:0}
.field label{
  display:block;
  font-size: 13px;
  font-weight: 500;
  color: var(--tc-text);
  margin-bottom: 6px;
}
.field label .req{color:var(--tc-danger);margin-left:2px}
.field .hint{font-size:11px;color:var(--tc-text-3);margin-top:4px;line-height:1.5}
.field input[type=text],
.field input[type=number],
.field input[type=date],
.field input[type=email],
.field select,
.field textarea{
  width:100%;
  height:36px;
  padding: 0 12px;
  background: #fff;
  border: 1px solid var(--tc-border);
  border-radius: var(--tc-radius);
  font-size: 13px;
  color: var(--tc-text);
  outline: none;
  transition: all .15s;
}
.field textarea{height:auto;padding:8px 12px;resize:vertical;min-height:76px;line-height:1.55}
.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color: var(--tc-primary);
  box-shadow: 0 0 0 3px rgba(0,82,217,.08);
}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* 步骤条 */
.tc-steps{
  display:flex;
  margin: 0 -22px 20px;
  padding: 0 22px 20px;
  border-bottom: 1px dashed var(--tc-border);
  gap: 0;
}
.tc-step{
  flex:1;
  display:flex;align-items:flex-start;gap:10px;
  position: relative;
  padding-right: 10px;
}
.tc-step + .tc-step::before{
  content:'';position:absolute;left:-10px;top:12px;
  width: calc(100% - 12px);
  height: 2px;
  background: var(--step-color, var(--tc-border));
}
.tc-step-num{
  width:24px;height:24px;border-radius:50%;
  background: var(--step-bg, var(--tc-bg-2));
  color: var(--step-color, var(--tc-text-3));
  display:flex;align-items:center;justify-content:center;
  font-size: 12px;
  font-weight: 600;
  flex-shrink:0;
  border: 2px solid var(--step-color, var(--tc-border));
  z-index: 1;
}
.tc-step.done{--step-bg:var(--tc-success-light);--step-color:var(--tc-success)}
.tc-step.active{--step-bg:#fff;--step-color:var(--tc-primary)}
.tc-step.done .tc-step-num::after{content:'✓'}
.tc-step-info{min-width:0;flex:1;padding-top:1px}
.tc-step-name{font-size:12px;font-weight:600;color:var(--tc-text);line-height:1.2;margin-bottom:2px}
.tc-step-name.muted{color:var(--tc-text-3);font-weight:normal}
.tc-step-desc{font-size:11px;color:var(--tc-text-3)}

/* ============ 空状态 ============ */
.tc-empty{
  padding: 60px 20px;
  text-align: center;
  color: var(--tc-text-3);
}
.tc-empty-icon{
  width: 80px; height: 80px;
  margin: 0 auto 16px;
  border-radius: 50%;
  background: var(--tc-bg-2);
  display:flex;align-items:center;justify-content:center;
  font-size: 36px;
  opacity: .8;
}
.tc-empty h3{
  font-size: 15px;
  font-weight: 600;
  color: var(--tc-text-2);
  margin-bottom: 6px;
}
.tc-empty p{font-size:13px;margin-bottom:16px;line-height:1.6}

/* ============ 滚动条 ============ */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#D3D6DB;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#B9BEC6}
::-webkit-scrollbar-track{background:transparent}

/* ============ 响应式 ============ */
@media (max-width: 1400px){
  .tc-template-grid{grid-template-columns: repeat(4, 1fr)}
  .tc-kpi-grid{grid-template-columns: repeat(4, 1fr)}
}
@media (max-width: 1180px){
  .tc-template-grid{grid-template-columns: repeat(3, 1fr)}
  .tc-kpi-grid{grid-template-columns: repeat(2, 1fr)}
  .tc-chart-grid{grid-template-columns: 1fr}
  .tc-agent-grid{grid-template-columns: 1fr}
}
@media (max-width: 900px){
  .tc-sidebar{display:none}
  .tc-search{display:none}
  .tc-workbench-head{align-items:flex-start;flex-direction:column}
  .tc-workbench-actions{width:100%;justify-content:space-between}
  .tc-template-grid{grid-template-columns: repeat(2, 1fr)}
  .tc-main{padding:16px}
  .tc-agent-stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width: 600px){
  .tc-template-grid{grid-template-columns: 1fr}
  .tc-kpi-grid{grid-template-columns: 1fr}
  .tc-workbench-actions{align-items:flex-start;flex-direction:column}
  .tc-product-switch{display:none}
  .tc-nav-menu{display:none}
  .field-row{grid-template-columns: 1fr}
}

/* ============ 控制台交互增强 ============ */
.tc-agent-card[role="button"]{cursor:pointer}
.tc-agent-card[role="button"]:focus-visible,
.tc-template-card:focus-visible,
.tc-sidebar-item:focus-visible,
.tc-action-btn:focus-visible,
.btn:focus-visible,
.tc-icon-btn:focus-visible{
  outline:none;
  box-shadow:0 0 0 3px rgba(0,82,217,.22);
}
.tc-agent-card[role="button"]:hover{border-color:var(--tc-primary)}
.tc-agent-card[role="button"] .tc-action-btn{position:relative;z-index:1}
.tc-agent-empty{display:none;padding:48px 20px;text-align:center;color:var(--tc-text-3);background:var(--tc-surface);border:1px dashed var(--tc-border);border-radius:var(--tc-radius-lg)}
.tc-agent-empty strong{display:block;color:var(--tc-text);font-size:14px;margin-bottom:6px}
.tc-toast{
  position:fixed;right:24px;bottom:24px;z-index:1100;max-width:min(360px,calc(100vw - 32px));
  display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--tc-text);color:var(--tc-surface);
  border-radius:var(--tc-radius);box-shadow:var(--tc-shadow-xl);font-size:13px;animation:toast-in .2s ease;
}
.tc-toast::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--tc-success);flex-shrink:0}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media (max-width:600px){.tc-toast{right:16px;bottom:16px}}

/* ============ 企业组件视觉收束 ============ */
.tc-card,.tc-chart,.tc-table-wrap{
  border-radius:var(--tc-radius);
  box-shadow:none;
}
.tc-card:hover,.tc-chart:hover{box-shadow:none}
.tc-card-head{
  min-height:52px;
  padding:14px 18px;
  background:color-mix(in srgb,var(--tc-surface) 92%,var(--tc-bg));
}
.tc-card-body{padding:18px}
.tc-card-title{font-size:14px;letter-spacing:.1px}
.tc-kpi-grid{gap:12px}
.tc-kpi{
  min-height:128px;
  padding:16px 18px;
  border-radius:var(--tc-radius);
  box-shadow:none;
}
.tc-kpi::before{display:none}
.tc-kpi:hover{
  transform:none;
  border-color:var(--tc-border-2);
  box-shadow:none;
}
.tc-kpi-head{margin-bottom:10px}
.tc-kpi-icon{
  width:30px;height:30px;border-radius:var(--tc-radius-sm);
  background:var(--tc-bg);
}
.tc-kpi-value{font-size:24px;margin-bottom:4px;letter-spacing:0}
.tc-tabs{padding:0 4px;border-radius:var(--tc-radius) var(--tc-radius) 0 0}
.tc-tab{padding:13px 16px;font-size:13px}
.tc-tab.active::after{height:2px;left:10px;right:10px}
.tc-toolbar{margin-bottom:12px}
.tc-search-box,.tc-input,.tc-select{
  height:34px;
  border-radius:var(--tc-radius-sm);
  background:var(--tc-surface);
}
.tc-search-box:focus-within,.tc-input:focus,.tc-select:focus{
  box-shadow:0 0 0 3px color-mix(in srgb,var(--tc-primary) 14%,transparent);
}
.tc-template-grid{gap:12px}
.tc-template-card{
  min-height:164px;
  padding:14px;
  border-radius:var(--tc-radius);
  box-shadow:none;
}
.tc-template-card:hover{
  transform:none;
  border-color:var(--tc-border-2);
  box-shadow:0 2px 8px color-mix(in srgb,var(--tc-text) 8%,transparent);
}
.tc-template-icon{
  width:40px;height:40px;
  border-radius:var(--tc-radius-sm);
}
.tc-template-card .tc-template-icon{
  background:var(--tc-primary-light) !important;
}
.tc-template-card .tc-template-icon svg{
  color:var(--tc-primary) !important;
}
.tc-template-card .tc-tag{

/* ============ KPI 卡片渲染 ============ */

  return `
    <div class="tc-kpi" style="--kpi-color:${color};--kpi-bg:${bg}">
      <div class="tc-kpi-head">
        <div class="tc-kpi-label">${label}</div>
        <div class="tc-kpi-icon">${kpiIcon(icon)}</div>
      </div>
      <div class="tc-kpi-value">${value}</div>
      <div class="tc-kpi-sub">
        ${trend ? `<span class="tc-kpi-trend ${trendDir}">${trendDir==='up'?'↑':'↓'} ${trend}</span>` : ''}
        <span>较上周同期</span>
      </div>
    </div>
  `;
}

/* ============ 页面路由与初始化 ============ */
let currentPage = 'agents';
let currentSubtab = 'templates';

function renderPage(pageKey) {
  const page = pages[pageKey];
  if (!page) return;
  currentPage = pageKey;

  // 面包屑 + 标题区渲染
  const bc = page.breadcrumb || [];
  const main = document.getElementById('main-content');
  main.innerHTML = `
    <section class="tc-page-shell" data-od-id="page-${pageKey}">
      <div class="tc-breadcrumb" data-od-id="breadcrumb-${pageKey}">
        ${bc.map((b,i) => i<bc.length-1
          ? `<a>${b}</a><span class="sep">/</span>`
          : `<span class="current">${b}</span>`
        ).join('')}
      </div>
      ${page.render()}
    </section>
  `;

  // 侧边栏 active
  document.querySelectorAll('.tc-sidebar-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === pageKey);
  });

  // Tab 点击绑定
  main.querySelectorAll('[data-subtab]').forEach(tab => {
    tab.addEventListener('click', () => {
      main.querySelectorAll('[data-subtab]').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentSubtab = tab.dataset.subtab;
      const body = document.getElementById('subtab-body');
      if (!body) return;
      const renderers = {
        templates: renderSubtabTemplates,
        projects:  renderSubtabProjects,
        runs:      renderSubtabRuns,
        settings:  renderSubtabSettings,
      };
      if (renderers[currentSubtab]) {
        body.innerHTML = renderers[currentSubtab]();
        updateAgentFilter(main);
      }
    });
  });

  // 子页面导航：表格里点击 cell-link[data-page] / sidebar 外 data-page
  main.querySelectorAll('[data-page]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.preventDefault();
      renderPage(el.dataset.page);
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });

  bindPageInteractions();
  updateAgentFilter(main);
}

function updateAgentFilter(main) {
  const search = main.querySelector('[data-agent-search]');
  const status = main.querySelector('[data-agent-status]');
  const cards = Array.from(main.querySelectorAll('[data-agent-card]'));
  const empty = main.querySelector('[data-agent-empty]');
  if (!cards.length) return;

  const keyword = (search ? search.value : '').trim().toLowerCase();
  const selectedStatus = status ? status.value : 'all';
  let visible = 0;
  cards.forEach(card => {
    const matchesKeyword = !keyword || card.dataset.agentName.toLowerCase().includes(keyword);
    const matchesStatus = selectedStatus === 'all' || card.dataset.agentState === selectedStatus;
    const show = matchesKeyword && matchesStatus;
    card.style.display = show ? '' : 'none';
    if (show) visible += 1;
  });
  if (empty) empty.style.display = visible ? 'none' : 'block';
}

function openAgentWorkspace(card) {
  const destination = card.dataset.agentDestination || 'project-detail.html';
  window.location.href = destination;
}

function showToast(message) {
  document.querySelector('.tc-toast')?.remove();
  const toast = document.createElement('div');
  toast.className = 'tc-toast';
  toast.setAttribute('role', 'status');
  toast.textContent = message;
  document.body.appendChild(toast);
  window.setTimeout(() => toast.remove(), 2600);
}

function bindPageInteractions() {
  const main = document.getElementById('main-content');
  if (main.dataset.interactionsBound) return;
  main.dataset.interactionsBound = 'true';

  main.addEventListener('input', event => {
    if (event.target.matches('[data-agent-search]')) updateAgentFilter(main);
  });
  main.addEventListener('change', event => {
    if (event.target.matches('[data-agent-status]')) updateAgentFilter(main);
  });
  main.addEventListener('click', event => {
    const action = event.target.closest('[data-agent-action]');
    const card = event.target.closest('[data-agent-card]');
    if (action && card) {
      event.preventDefault();
      event.stopPropagation();
      if (action.dataset.agentAction === 'monitor') {
        renderPage('observability');
        showToast(`已打开 ${card.querySelector('.tc-agent-name').childNodes[0].textContent.trim()} 的运行观测`);
      } else {
        openAgentWorkspace(card);
      }
      return;
    }
    if (card) {
      openAgentWorkspace(card);
      return;
    }
    if (event.target.closest('.tc-cell-link') && !event.target.closest('[data-page]')) {
      showToast('详情面板将在完整产品中提供；当前为交互原型。');
    }
  });
  main.addEventListener('keydown', event => {
    const card = event.target.closest('[data-agent-card]');
    if (card && (event.key === 'Enter' || event.key === ' ')) {
      event.preventDefault();
      openAgentWorkspace(card);
    }
  });
}

function showModal(key) {
  const m = modals[key];
  if (!m) return;
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title">${kpiIcon(m.icon)} ${m.title}</div>
        <button class="modal-close" onclick="this.closest('.modal-bg').remove()">${kpiIcon('close')}</button>
      </div>
      <div class="modal-body">${m.body}</div>
      <div class="modal-foot">
        ${m.actions.map(a => {
          if (typeof a === 'string') return `<button class="btn btn-default" onclick="this.closest('.modal-bg').remove()">${a}</button>`;
          return `<button class="btn btn-primary" onclick="this.closest('.modal-bg').remove();showToast('已提交：${a.label}')">${a.label}</button>`;
        }).join('')}
      </div>
    </div>
  `;
  bg.addEventListener('click', e => { if (e.target === bg) bg.remove(); });
  document.body.appendChild(bg);
}
