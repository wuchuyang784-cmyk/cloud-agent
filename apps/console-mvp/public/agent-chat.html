<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Agent 对话</title>
    <style>
      :root { color: #1f2329; background: #f5f7fa; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { display: grid; min-width: 320px; min-height: 100dvh; margin: 0; place-items: center; padding: 24px; }
      main { width: min(440px, 100%); padding: 28px; border: 1px solid #e5e6eb; border-radius: 8px; background: #fff; text-align: center; }
      h1 { margin: 0; font-size: 18px; font-weight: 600; line-height: 1.4; }
      p { margin: 10px 0 0; color: #4e5969; font-size: 14px; line-height: 1.6; }
      small { display: block; margin-top: 14px; color: #86909c; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="agent-name">Agent 对话</h1>
      <p>对话功能暂未正式上线。</p>
      <small>服务上线后将在此提供对话入口。</small>
    </main>
    <script>
      const agent = new URLSearchParams(window.location.search).get('agent');
      if (agent) document.querySelector('#agent-name').textContent = `${agent} 对话`;
    </script>
  </body>
</html>
